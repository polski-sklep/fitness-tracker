[project]
name = "fitness-tracker"
version = "0.1.0"
description = "Single-user fitness tracker with FastAPI, Postgres, Telegram, and Claude extraction."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.49",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "python-telegram-bot>=21.10",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

