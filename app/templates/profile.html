{% extends "base.html" %}
{% block title %}Profile · Jacob's Fitness Tracker{% endblock %}
{% block content %}
<section class="rounded-2xl p-5" style="background: #0d1117;">
  <div class="mb-4 flex items-center justify-between gap-4">
    <a href="/" class="text-sm font-bold text-[#3b82f6]">← Dashboard</a>
  </div>
  <h2 class="mb-4 text-2xl font-bold">Jacob Kowalewski</h2>
  <form method="post" action="/profile/edit" class="space-y-4">
    <textarea name="body" class="min-h-[32rem] w-full rounded-xl border border-slate-700 bg-slate-950 p-4 font-mono text-sm text-slate-200">{{ body }}</textarea>
    <button type="submit" class="rounded-xl bg-emerald-500 px-4 py-2 font-semibold text-slate-950">Save Profile</button>
  </form>
</section>
{% endblock %}
