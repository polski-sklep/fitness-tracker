services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-8000}:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/historical:/app/data/historical:ro
      - ./profile:/app/profile
      - ./text:/app/text
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped
